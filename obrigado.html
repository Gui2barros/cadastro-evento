<!-- obrigado.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obrigado pelo cadastro!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .mensagem {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    .mensagem h1 {
      color: #da1f26; /* Cor Honda */
    }
  </style>
</head>
<body>
  <div class="mensagem">
    <h1>Obrigado!</h1>
    <p>Seus dados foram recebidos com sucesso.</p>
    <p>Boa sorte no sorteio do brinde!</p>
  </div>
</body>
</html>
