<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro - Golden Motos</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo img {
      width: 150px;
    }

    h2 {
      text-align: center;
      color: #c00000;
    }

    p {
      text-align: center;
      font-size: 0.95rem;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 1rem;
    }

    form button {
      width: 100%;
      padding: 12px;
      background-color: #c00000;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    form button:hover {
      background-color: #a00000;
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }
    }
  </style>

  <script>
    // Máscara para CPF
    function formatCPF(input) {
      input.value = input.value
        .replace(/\D/g, "")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d)/, "$1.$2")
        .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    }

    // Máscara para celular
    function formatPhone(input) {
      input.value = input.value
        .replace(/\D/g, "")
        .replace(/^(\d{2})(\d)/, "($1) $2")
        .replace(/(\d{5})(\d{4})$/, "$1-$2");
    }

    // Alerta de sucesso
    function confirmarEnvio() {
      alert("Cadastro enviado com sucesso! Boa sorte no sorteio do brinde 🎁");
    }
  </script>
</head>
<body>
  <div class="container">
   
    <h2>Cadastre-se e concorra a um brinde!</h2>
    <p>Preencha seus dados para participar do sorteio exclusivo do evento.</p>

    <form action="https://formsubmit.co/crm@goldenmotos.com" method="POST" onsubmit="confirmarEnvio()">
      <!-- Substitua SEU_EMAIL_AQUI pelo e-mail real -->
      
      <input type="text" name="nome" placeholder="Seu nome completo" required autocomplete="name" />

      <input type="text" name="cpf" placeholder="Digite seu CPF"
             oninput="formatCPF(this)" maxlength="14" required autocomplete="on" />

      <input type="text" name="celular" placeholder="Digite seu celular"
             oninput="formatPhone(this)" maxlength="15" required autocomplete="tel" />

      <input type="email" name="email" placeholder="Digite seu e-mail" required autocomplete="email" />

      <!-- Anti-bot -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://cadastro-evento.vercel.app/obrigado.html" />

      <button type="submit">Enviar</button>
    </form>
  </div>
</body>
</html>
